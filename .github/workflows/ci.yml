name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      # La CLI de Prisma 7 lee DATABASE_URL desde prisma7.config.ts (dotenv).
      # En CI no hay PostgreSQL: URL dummy solo para validate/generate.
      - name: Env mínimo para Prisma
        run: echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/ci?schema=public"' > .env

      - name: Validar schema Prisma
        run: yarn prisma validate

      - name: Typecheck
        run: yarn typecheck

      - name: Lint (ESLint)
        run: yarn lint

      - name: Tests (Vitest)
        run: yarn test

      - name: Build
        run: yarn build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Lint (oxlint)
        run: yarn lint

      - name: Build
        run: yarn build
