# PostgreSQL para desarrollo — Portal de Prácticas TP
# Uso: docker compose up -d   (crea la BD definida en .env: portal_practicas)
services:
  db:
    image: postgres:17-alpine
    container_name: portal-practicas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portal_practicas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portal_practicas']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
